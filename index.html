<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f3f5ee"><title>顺手带 · 交互演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0e8;color:#192a23;font:16px/1.55 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #1c8156;outline-offset:3px}.wrap{max-width:1030px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{letter-spacing:.08em;font-weight:850}.badge{background:#dbe5d6;border-radius:40px;padding:5px 12px;font-size:.875rem}.hero{border-radius:26px;background:#173e30;color:#fff;padding:34px 38px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:240px;height:240px;top:-110px;right:-30px;border-radius:50%;border:35px solid #c7ee7d29;pointer-events:none}.hero p{max-width:580px;margin:8px 0 0;color:#e1eee3}.kicker{color:#c9ef85;font-weight:800;font-size:.875rem;letter-spacing:.08em}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.13;margin:9px 0}.steps{display:flex;gap:8px;padding:19px 0;flex-wrap:wrap}.step{border-radius:50px;padding:6px 11px;color:#455d50;font-size:.875rem}.active{background:#c9eb91;color:#183a29;font-weight:750}.grid{display:grid;grid-template-columns:1.38fr 1fr;gap:16px;align-items:start}.panel{border-radius:22px;background:#fff;padding:21px;min-width:0}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}h2,h3,p{margin:0}h2{font-size:1.35rem}h3{font-size:1rem}.muted{color:#4f6559}.heading .muted,.unit{font-size:.875rem}.search{border:1px solid #ced9ce;border-radius:12px;padding:10px 12px;width:100%;margin-bottom:8px;background:#f9fbf8;color:#192a23}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf1ec}.row:last-child{border-bottom:0}.tile{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:1.52rem;flex:none}.txt{flex:1;min-width:0}.price{font-weight:800;color:#22613f}.ctrl{display:flex;gap:8px;align-items:center;white-space:nowrap}.qty{min-width:15px;text-align:center}.small,.link{border:0;color:#18442f;background:#e3efdc;border-radius:10px;padding:7px 11px;font-weight:800;min-width:40px}.small:disabled{background:#e9ede8;color:#68766d}.link{font-size:.875rem;background:transparent;text-decoration:underline;padding:7px 0}.progress{background:#eef5e6;border-radius:14px;padding:13px;margin:0 0 9px}.progress strong{display:block;margin-bottom:9px}.bar{height:8px;background:#d7e5d3;border-radius:10px;overflow:hidden}.bar span{display:block;background:#357a4e;height:100%;border-radius:10px}.primary{width:100%;border:0;border-radius:13px;padding:13px 12px;margin-top:12px;background:#1d4e38;color:#fff;font-weight:800}.primary:disabled{background:#e2e8df;color:#4f6458}.total{margin-top:12px;display:flex;justify-content:space-between;font-weight:800}.warning{margin-top:10px;font-size:.875rem;color:#4f6559}.single{max-width:640px;margin:auto}.notice{background:#ecf5e5;padding:13px;border-radius:12px;margin:12px 0}.shop{display:contents}footer{font-size:.875rem;color:#4f6559;margin:22px 0 0;text-align:center} [hidden]{display:none!important}.empty{padding:13px 0;color:#4f6559}
@media(max-width:690px){.wrap{padding:14px}.hero{padding:24px 20px}.grid{grid-template-columns:1fr}.panel{padding:16px}.steps{padding:12px 0;gap:2px}.step{padding:5px 7px}.row{gap:8px}.tile{width:46px;height:46px}.top{margin-bottom:13px}.small{padding:6px 8px;min-width:36px}}
</style></head><body><main class="wrap"><header class="top"><span class="brand">顺手带</span><a class="badge" href="./report.html" style="color:#18442f;font-weight:700">查看数据报表样稿</a></header><section class="hero"><div class="kicker">线上交互样稿</div><h1>凑满 5 件，顺手带走</h1><p>从购物车里直接找补单商品，凑齐后再确认订单。默认放了 4 件，可以从「还差 1 件」开始试。</p></section><nav class="steps" aria-label="演示进度"><span class="step active">① 选购凑单</span><span class="step">② 确认订单</span><span class="step">③ 模拟支付</span><span class="step">④ 完成</span></nav>
<div id="shop" class="grid"><section class="panel"><div class="heading"><h2>可凑单商品</h2><span class="muted">示例活动价 ¥1 / 件</span></div><input id="search" class="search" placeholder="搜纸巾、洗手液、海绵…" aria-label="搜索可凑单商品"><div id="products"></div></section><section class="panel"><div class="heading"><h2>购物车</h2><button class="link" id="reset">重置体验</button></div><div id="progress" class="progress" aria-live="polite"></div><div id="cart"></div><div class="total"><span>活动商品小计</span><span id="amount">未达门槛</span></div><button class="primary" id="checkout" disabled>还差 1 件</button><p class="warning">仅演示购物流程，不收集账号或地址。</p></section></div>
<section id="next" class="panel single" hidden></section><footer>所有商品、价格和订单均为示例，不代表真实售卖或平台承诺。</footer></main>
<script>
const ITEMS=[['便携纸巾','10 包／件','🧻','#e8f0fc',2],['清香洗手液','1 瓶／件','🧴','#e2f0e8',1],['厨房海绵','3 片／件','🧽','#f9f0d8',2],['抽绳垃圾袋','2 卷／件','🛍️','#f0e9fa',2],['棉柔洗脸巾','1 包／件','☁️','#e9f0fa',1],['厨房湿巾','1 包／件','🌿','#e5f3df',2],['便携封口夹','4 个／件','📎','#fde9df',2]];
const $=id=>document.getElementById(id);let quantities,stage=0;
function count(){return quantities.reduce((sum,n)=>sum+n,0)}
function change(i,delta){const n=quantities[i]+delta;if(n<0||n>ITEMS[i][4])return;quantities[i]=n;renderShop()}
function item(i,cart=false,summary=false){const [name,unit,icon,color,limit]=ITEMS[i],n=quantities[i];return `<div class="row"><div class="tile" aria-hidden="true" style="background:${color}">${icon}</div><div class="txt"><h3>${name}</h3><div class="muted unit">${unit}${summary?'':' · 限购 '+limit+' 件'}</div></div>${summary?`<span class="price">×${n} · ¥${n}</span>`:`<div class="ctrl">${cart?`<button class="small" data-i="${i}" data-d="-1" aria-label="减少${name}">−</button><span class="qty">${n}</span>`:'<span class="price">¥1</span>'}<button class="small" data-i="${i}" data-d="1" aria-label="加购${name}" ${n>=limit?'disabled':''}>${n>=limit?(cart?'+':'已达限购'):'+'}</button></div>`}</div>`}
function picked(summary){return ITEMS.map((_,i)=>quantities[i]?item(i,!summary,summary):'').join('')||'<p class="empty">购物车是空的，先挑几件喜欢的。</p>'}
function renderShop(){const n=count(),gap=Math.max(0,5-n),kw=$('search').value.trim();$('products').innerHTML=ITEMS.map(([name],i)=>name.includes(kw)?item(i):'').join('')||'<p class="empty">没找到，试试「纸巾」或「海绵」。</p>';$('cart').innerHTML=picked(false);$('progress').innerHTML=`<strong>${gap?'再选 '+gap+' 件，享活动价':'已满 5 件，可享活动价'} · ${n} 件</strong><div class="bar" role="progressbar" aria-label="凑单进度" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${Math.min(n,5)}"><span style="width:${Math.min(n,5)*20}%"></span></div>`;$('checkout').disabled=!!gap;$('checkout').textContent=gap?'还差 '+gap+' 件':'去结算';$('amount').textContent=gap?'未达门槛':'¥'+n+'.00'}
function show(s){stage=s;$('shop').hidden=!!s;$('next').hidden=!s;document.querySelectorAll('.step').forEach((e,i)=>{e.classList.toggle('active',i===s);if(i===s)e.setAttribute('aria-current','step');else e.removeAttribute('aria-current')});if(s===1)$('next').innerHTML=`<div class="heading"><h2>确认订单</h2><button class="link" data-go="0">返回修改</button></div><div class="notice">演示收货信息 · 不需要填写真实地址</div>${picked(true)}<div class="total"><span>合计 · 共 ${count()} 件</span><span>¥${count()}.00</span></div><button class="primary" data-go="2">提交模拟订单</button>`;if(s===2)$('next').innerHTML=`<div class="heading"><h2>模拟收银台</h2><button class="link" data-go="1">返回订单</button></div><div class="notice">这里模拟提交订单后的收银台。不会打开任何支付应用，也不会扣款。</div><div class="total"><span>模拟应付</span><span>¥${count()}.00</span></div><button class="primary" data-go="3">模拟支付成功</button>`;if(s===3)$('next').innerHTML=`<h2>演示完成</h2><div class="notice">已走完选购、凑单、结算和支付。没有生成真实订单。</div><button class="primary" data-reset>再体验一次</button>`;if(s)$('next').querySelector('h2').tabIndex=-1;if(s)$('next').querySelector('h2').focus();else $('search').focus()}
function reset(){quantities=[1,1,1,1,0,0,0];$('search').value='';renderShop();if(stage)show(0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.i!==undefined){change(+b.dataset.i,+b.dataset.d);const replacement=[...document.querySelectorAll('#'+(b.dataset.d==='-1'||b.closest('#cart')?'cart':'products')+' button')].find(x=>x.dataset.i===b.dataset.i&&x.dataset.d===b.dataset.d&&!x.disabled);if(replacement)replacement.focus()}if(b.dataset.go!==undefined){const s=+b.dataset.go;if(s<2||count()>=5)show(s)}if(b.hasAttribute('data-reset'))reset()});$('search').addEventListener('input',renderShop);$('reset').addEventListener('click',reset);$('checkout').addEventListener('click',()=>{if(count()>=5)show(1)});reset();
</script></body></html>
